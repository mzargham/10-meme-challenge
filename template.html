<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meme {{n}}</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <main style="text-align: center; padding: 1rem;">
    <img src="../memes/{{img}}" alt="Meme {{n}}" style="max-width: 100%; height: auto;" />
    <div style="margin-top: 1rem;">
      <a href="../index.html">🔙 Gallery</a> |
      <a href="../meme/{{prev}}.html">⬅️ Previous</a> |
      <a href="../meme/{{next}}.html">➡️ Next</a>
    </div>
    <div style="margin-top: 1rem;">
      <a href="https://twitter.com/intent/tweet?text=Check%20this%20meme!&url={{share_url}}" target="_blank" data-image="../memes/{{img}}">🐦 Tweet</a>
      |
      <button onclick="navigator.clipboard.writeText(window.location.href)">📋 Copy Link</button>
    </div>
  </main>
</body>
</html>
